<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Comprar | Salsa Pícara</title>

    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap"
        rel="stylesheet"
    >

    <!-- CSS -->
    <link
        rel="stylesheet"
        th:href="@{/css/estilos.css}"
        href="/css/estilos.css"
    >
</head>


<body class="inner-page">

    <!-- =========================================
         ENCABEZADO
         ========================================= -->

    <header class="site-header">

        <a class="brand" href="/">
            <span class="brand-mark">SP</span>
            <span>Salsa Pícara</span>
        </a>

        <a class="back-link" href="/">
            ← Volver al inicio
        </a>

    </header>


    <!-- =========================================
         CONTENIDO PRINCIPAL
         ========================================= -->

    <main class="checkout-layout">

        <!-- -----------------------------------------
             PRESENTACIÓN
             ----------------------------------------- -->

        <section class="checkout-intro">

            <p class="eyebrow">
                Un frasco de puro carácter
            </p>

            <h1>
                Hazlo <em>picosito.</em>
            </h1>

            <p>
                Tu mesa está a punto de conocer
                su nuevo ingrediente favorito.
            </p>


            <!-- Galería del producto: una imagen arriba y dos abajo -->

            <section aria-label="Galería de Salsa Pícara">
    <div class="product-gallery">
        <img
            class="gallery-image gallery-image-top"
            th:src="@{/images/SalsaPicara-Presentacion250ml-1.png}"
            alt="Salsa Pícara, imagen principal"
        >
        <img
            class="gallery-image gallery-image-bottom"
            th:src="@{/images/SalsaPicara-Presentacion60ml.png}"
            alt="Salsa Pícara, detalle del producto"
        >
        <img
            class="gallery-image gallery-image-bottom"
            th:src="@{/images/SalsaPicara-Presentacion250ml-2.png}"
            alt="Salsa Pícara, presentación del producto"
        >
    </div>
</section>


        <!-- -----------------------------------------
             FORMULARIO DEL PEDIDO
             ----------------------------------------- -->

        <section class="order-card" aria-labelledby="order-title">

            <p class="eyebrow">
                Tu pedido
            </p>

            <h2
                id="order-title"
                th:text="${nombreSalsa}"
            >
                Salsa Pícara
            </h2>

            <p class="price">
                $150
                <span>MXN por botella</span>
            </p>
  
            <p class="price">
                $360
                <span>MXN por paquete</span>
            </p>

            <form action="/pedidos" method="post">

                <!-- Nombre -->

                <div class="field">

                    <label for="nombre">
                        Nombre completo
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        autocomplete="name"
                        required
                    >

                </div>


                <!-- Teléfono -->

                <div class="field">

                    <label for="telefono">
                        Teléfono
                    </label>

                    <input
                        type="tel"
                        id="telefono"
                        name="telefono"
                        autocomplete="tel"
                        required
                    >

                </div>

                <!-- Código Postal -->
                <div class="field">

                    <label for="codigoPostal">
                        Código Postal
                    </label>

                    <input
                        type="text"
                        id="codigoPostal"
                        name="CodigoPostal"
                    
                        autocomplete="postal-code"
                        required
                    >

                </div>


                <!-- Cantidad -->

                <div class="field">

                    <label for="cantidad">
                        ¿Cuántas quieres?
                    </label>

                    <input
                        type="number"
                        id="cantidad"
                        name="cantidad"
                        min="0"
                        value="1"
                        required
                    >

                </div>
                 
                    <!-- Cantidad De Paquetes -->

                <div class="field">

                    <label for="cantidadPaquetes">
                        ¿Te gustaria un paquete?
                    </label>

                    <input
                        type="number"
                        id="cantidadPaquetes"
                        name="cantidadPaquetes"
                        min="0"
                        value="1"
                        required
                    >

                </div>
     

                <!-- Enviar pedido -->

                <button
                    type="submit"
                    class="boton boton-full"
                >
                    Realizar pedido
                    <span aria-hidden="true">→</span>
                </button>

            </form>

        </section>

    </main>

</body>

</html>
